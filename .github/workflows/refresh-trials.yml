name: Refresh trial data

# Weekly incremental sync from ClinicalTrials.gov. Only new/changed trials are
# re-embedded; trials that stopped recruiting are pruned.
# Requires repo secrets: DATABASE_URL, OPENAI_API_KEY.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "Max trials to ingest"
        default: "70000"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m scripts.ingest_trials --max "${{ inputs.max || '70000' }}" --all-types --prune
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
